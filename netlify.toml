[build]
  publish = "src/public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/receipt/*"
  to = "/.netlify/functions/api/receipt/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

